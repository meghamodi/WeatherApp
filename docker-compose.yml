services:
  api:
    build: ./server      # Path to your Dockerfile
    container_name: weather-app-container
    networks:
      - app-network
    # host port: container port
    ports:
      - "5001:3000"
    env_file:
      - .env     # Use the same env file for API
    depends_on:
      - db
    command: ["node", "index.js"]

  frontend:
    build: ./frontend
    container_name: weather-app-frontend
    networks:
      - app-network
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_URL=http://api:3000
    command: ["npm", "start"]  # or your frontend start command

  db:
    image: postgres:15
    container_name: weather-db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

# add prometheus service 


# add grafana service 


# add locust service 


volumes:
  pgdata:
  grafana-data:

networks:
  app-network:
    driver: bridge

